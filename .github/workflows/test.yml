name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      # Fails if a published question changed without a documented re-baseline.
      - run: npm run audit:questions

  # Learner journeys in a real browser against the packaged dist/ build.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Traces, screenshots, videos, console logs and storage for each failed journey.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 14
