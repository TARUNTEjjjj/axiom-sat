<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Axiom</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Missing URLs at any depth get this page, so links resolve from the site root.
         GitHub Pages serves the site from /axiom-sat/ instead, so the base moves there on
         that host only: a pages.dev address that happens to start with /axiom-sat/ must
         keep the real root. -->
    <base href="/" />
    <script>
      if (location.hostname.endsWith('.github.io') && location.pathname.startsWith('/axiom-sat/')) {
        document.querySelector('base').href = '/axiom-sat/';
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='%232563eb'/></svg>"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/transitions.css" />
    <style>
      .missing {
        padding: clamp(72px, 14vw, 160px) 0;
      }

      .missing .lead {
        max-width: 560px;
        margin-top: 20px;
      }

      .missing-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <script>
      // The <base> above would resolve #main to the home page; keep the skip link on this page.
      document.querySelector('.skip-link').href = new URL('#main', location.href).href;
    </script>
    <header class="nav">
      <div class="container nav-inner">
        <a class="wordmark" href="index.html"><span class="wordmark-dot" aria-hidden="true"></span>Axiom</a>
        <nav aria-label="Primary">
          <ul class="nav-links" role="list">
            <li><a href="index.html">Overview</a></li>
            <li><a href="bank.html">Question Bank</a></li>
            <li><a href="practice.html">Practice</a></li>
            <li><a href="progress.html">Progress</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page" id="main">
      <section class="missing" aria-labelledby="missing-title">
        <div class="container">
          <p class="eyebrow">404</p>
          <h1 class="title" id="missing-title">This page isn't here.</h1>
          <p class="lead">The address may have a typo, or the page may have moved.</p>
          <div class="missing-actions">
            <a class="btn btn-primary" href="bank.html">Open the question bank</a>
            <a class="btn btn-secondary" href="index.html">Go to the home page</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <p class="footer-copy">© 2026 Tarun Tej</p>
        <p class="footer-copy">MIT licensed</p>
      </div>
    </footer>

    <script type="module" src="assets/js/transitions.js"></script>
  </body>
</html>
